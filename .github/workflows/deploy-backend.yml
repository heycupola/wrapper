name: Deploy backend (Convex)

# Branch -> environment:
#   push to `dev`  -> GitHub Environment "dev"        -> dev Convex deployment (sleek-echidna)
#   push to `main` -> GitHub Environment "production"  -> prod Convex deployment (confident-fox)
# The only thing that differs per environment is the env-scoped CONVEX_DEPLOY_KEY
# secret; `convex deploy` targets whichever deployment that key belongs to.

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "packages/backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Convex
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is not set for the '${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}' environment."
            exit 1
          fi

      - name: Deploy
        run: bun run --cwd packages/backend deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
