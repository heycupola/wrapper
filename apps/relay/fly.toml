# Production Fly config. The deploy workflow passes `--app wrapper-relay-prod`
# on `main`, which overrides `app` below. Dev deploys use `fly.dev.toml`.
# Each app holds its own CONVEX_URL secret.
app = "wrapper-relay-prod"
# Bucharest — the closest Fly region to Turkey (~450km from Istanbul vs ~1870km
# to Frankfurt/fra), which roughly halves relay round-trip latency for TR users.
# Revisit (or go multi-region) as the user base spreads.
# Existing Machines were created in fra and stay there until explicitly moved;
# primary_region only places new Machines.
primary_region = "otp"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
# The relay carries live WebSocket sessions. fly-proxy does not hold a WS
# upgrade through a cold start, so an auto-stopped machine drops shares. Keep
# one machine always running so WS connections never hit a cold boot.
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "15s"
method = "GET"
path = "/healthz"
timeout = "3s"

# shared-cpu-1x @ 256mb is the smallest Fly size. The process sits around 60MB
# RSS; 1gb was idle headroom. Do not add a second Machine without budget approval.
[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
