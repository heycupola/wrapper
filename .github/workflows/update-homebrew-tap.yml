name: Update Homebrew Tap

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha_darwin_arm64:
        required: false
        type: string
      sha_darwin_x64:
        required: false
        type: string
      sha_linux_arm64:
        required: false
        type: string
      sha_linux_x64:
        required: false
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    name: Update wrapper formula
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      SHA_DARWIN_ARM64: ${{ inputs.sha_darwin_arm64 }}
      SHA_DARWIN_X64: ${{ inputs.sha_darwin_x64 }}
      SHA_LINUX_ARM64: ${{ inputs.sha_linux_arm64 }}
      SHA_LINUX_X64: ${{ inputs.sha_linux_x64 }}

    steps:
      - name: Validate Homebrew tap token
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required"
            exit 1
          fi

      - name: Validate release version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must not include v and must look like 0.1.0 (got '${VERSION}')."
            exit 1
          fi

      - name: Resolve and verify release digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-metadata
          gh release download "v${VERSION}" \
            --repo heycupola/wrapper \
            --pattern checksums.txt \
            --dir release-metadata \
            --clobber
          RELEASE_JSON=$(gh release view "v${VERSION}" --repo heycupola/wrapper --json assets)
          export RELEASE_JSON
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          import re
          from pathlib import Path

          assets = {
              asset["name"]: (asset.get("digest") or "").removeprefix("sha256:")
              for asset in json.loads(os.environ["RELEASE_JSON"])["assets"]
          }
          required = {
              "wrapper-darwin-arm64.tar.gz": "SHA_DARWIN_ARM64",
              "wrapper-darwin-x86_64.tar.gz": "SHA_DARWIN_X64",
              "wrapper-linux-arm64.tar.gz": "SHA_LINUX_ARM64",
              "wrapper-linux-x86_64.tar.gz": "SHA_LINUX_X64",
          }
          checksums = {}
          for line in Path("release-metadata/checksums.txt").read_text(encoding="utf-8").splitlines():
              parts = line.split()
              if len(parts) != 2:
                  raise SystemExit(f"Malformed checksums.txt line: {line!r}")
              digest, name = parts
              name = name.removeprefix("*")
              if name in checksums:
                  raise SystemExit(f"Duplicate checksum for: {name}")
              if not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit(f"Invalid SHA-256 for: {name}")
              checksums[name] = digest

          unexpected = sorted(set(checksums) - set(required))
          if unexpected:
              raise SystemExit(
                  f"Unexpected entries in checksums.txt: {', '.join(unexpected)}"
              )

          missing = []
          for name, env_name in required.items():
              checksum_digest = checksums.get(name, "")
              asset_digest = assets.get(name, "")
              if not checksum_digest or not asset_digest:
                  missing.append(name)
                  continue
              if checksum_digest != asset_digest:
                  raise SystemExit(
                      f"Digest mismatch for {name}: checksums.txt={checksum_digest}, "
                      f"GitHub={asset_digest}"
                  )
              provided_digest = os.environ.get(env_name, "")
              if provided_digest and provided_digest != checksum_digest:
                  raise SystemExit(
                      f"Caller digest mismatch for {name}: caller={provided_digest}, "
                      f"release={checksum_digest}"
                  )
              print(f"{env_name}={checksum_digest}")

          if missing:
              raise SystemExit(f"Missing release digests for: {', '.join(missing)}")
          PY

      - name: Checkout Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: heycupola/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula/wrapper.rb
        working-directory: homebrew-tap
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          lines = [
              "# typed: false",
              "# frozen_string_literal: true",
              "",
              "# This formula is maintained via the heycupola/wrapper release workflow.",
              "class Wrapper < Formula",
              '  desc "Securely host and attach your terminal sessions across devices"',
              '  homepage "https://www.wrapper.sh"',
              f'  version "{os.environ["VERSION"]}"',
              '  license "MIT"',
              "",
              "  on_macos do",
              "    if Hardware::CPU.arm?",
              '      url "https://github.com/heycupola/wrapper/releases/download/v#{version}/wrapper-darwin-arm64.tar.gz"',
              f'      sha256 "{os.environ["SHA_DARWIN_ARM64"]}"',
              "    else",
              '      url "https://github.com/heycupola/wrapper/releases/download/v#{version}/wrapper-darwin-x86_64.tar.gz"',
              f'      sha256 "{os.environ["SHA_DARWIN_X64"]}"',
              "    end",
              "  end",
              "",
              "  on_linux do",
              "    if Hardware::CPU.arm?",
              '      url "https://github.com/heycupola/wrapper/releases/download/v#{version}/wrapper-linux-arm64.tar.gz"',
              f'      sha256 "{os.environ["SHA_LINUX_ARM64"]}"',
              "    else",
              '      url "https://github.com/heycupola/wrapper/releases/download/v#{version}/wrapper-linux-x86_64.tar.gz"',
              f'      sha256 "{os.environ["SHA_LINUX_X64"]}"',
              "    end",
              "  end",
              "",
              "  def install",
              '    bin.install "bin/wrapper"',
              '    bin.install Dir["bin/wrapper-pty-helper-*"]',
              "  end",
              "",
              "  test do",
              '    assert_match version.to_s, shell_output("#{bin}/wrapper --version")',
              "  end",
              "end",
              "",
          ]

          Path("Formula/wrapper.rb").write_text("\n".join(lines), encoding="utf-8")
          PY
          ruby -c Formula/wrapper.rb

      - name: Commit and push formula update
        working-directory: homebrew-tap
        run: |
          if git diff --quiet -- Formula/wrapper.rb; then
            echo "Formula already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/wrapper.rb
          git commit -m "chore: update wrapper to v${VERSION}"
          git push
