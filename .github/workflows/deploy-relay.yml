name: Deploy relay (Fly)

# Branch -> environment -> Fly app:
#   push to `dev`  -> Environment "dev"        -> vars.FLY_APP_NAME = wrapper-relay-dev
#   push to `main` -> Environment "production"  -> vars.FLY_APP_NAME = wrapper-relay-prod
# Each Fly app carries its own CONVEX_URL secret (set with `flyctl secrets set`)
# pointing at the matching Convex deployment, so fly.toml can be shared.

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/relay/**"
      - ".github/workflows/deploy-relay.yml"
  workflow_dispatch:

concurrency:
  group: deploy-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy relay
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Setup flyctl
        # Immutable commit for the upstream 1.6 tag.
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Validate config
        run: |
          if [ -z "${{ vars.FLY_APP_NAME }}" ]; then
            echo "::error::vars.FLY_APP_NAME is not set for the '${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}' environment."
            exit 1
          fi

      - name: Deploy
        working-directory: apps/relay
        # Use the relay directory as both the build context and config origin so
        # flyctl versions cannot reinterpret a repository-relative config path.
        # --ha=false: launch a single machine. The Fly org can't launch the
        # HA second machine yet (needs billing/verification); drop this flag
        # once HA is authorized.
        run: flyctl deploy . --remote-only --config fly.toml --app "${{ vars.FLY_APP_NAME }}" --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke
        run: RELAY_URL="https://${{ vars.FLY_APP_NAME }}.fly.dev" bun run --cwd apps/relay smoke
